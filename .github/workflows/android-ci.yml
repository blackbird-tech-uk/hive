name: Android CI

on:
  pull_request:
    paths: ["apps/android-agent/**", ".github/workflows/android-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/android-agent/**", ".github/workflows/android-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :app:assembleDebug

      - name: Upload debug APK for wireless testing
        uses: actions/upload-artifact@v4
        with:
          name: hive-agent-debug-apk
          path: apps/android-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
