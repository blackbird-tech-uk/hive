name: API CI

on:
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hive_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: hive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hive_test -d hive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hive_test:isolated_test_only@localhost:5432/hive_test
      HIVE_ISOLATED_POSTGRES_TEST: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest --cov=hive --cov-report=term-missing
